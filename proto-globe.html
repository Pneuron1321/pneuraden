<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PNEURADEN · Один мир</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
/* ═══ ПРОТОТИП «ОДИН МИР» ═══
   Экранов нет — есть высота камеры. Одна сцена MapLibre-глобуса от улицы до орбиты:
   3D-дома на улице, ивенты в городе, самолёты над регионом, МКС и линия ночи с орбиты.
   Цель пробы — проверить жест «улица → орбита» и частоту кадров на настоящем телефоне. */
:root{
  --bg:#030508;--glass:rgba(10,15,30,.82);--border:rgba(168,85,247,.22);--border2:rgba(168,85,247,.4);
  --np:#a855f7;--nc:#22d3ee;--ng:#fbbf24;--txt:#e2e8f0;--td:rgba(226,232,240,.6);--tm:rgba(226,232,240,.32);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'Rajdhani',sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{background:rgba(3,5,8,.6)!important;color:var(--tm)!important;font-size:9px}
.maplibregl-ctrl-attrib a{color:var(--td)!important}

.hud{position:fixed;z-index:5;pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--border);border-radius:14px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#top{top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;align-items:center;gap:8px}
#top a,#top button{pointer-events:auto}
.btn{height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  color:var(--txt);font:600 .8rem 'Rajdhani',sans-serif;letter-spacing:.06em;text-decoration:none;cursor:pointer}
.title{flex:1;font:700 .62rem 'Orbitron',monospace;letter-spacing:.28em;color:var(--np);text-transform:uppercase;
  text-shadow:0 0 12px rgba(168,85,247,.6)}
#fps{font:700 .62rem 'Orbitron',monospace;letter-spacing:.06em;padding:0 10px;height:28px;display:flex;align-items:center;color:var(--nc)}
#fps.low{color:var(--ng)} #fps.bad{color:#f43f5e}

/* лифт высоты: справа, от «ты» внизу до «Земля» наверху */
#lift{right:10px;top:calc(env(safe-area-inset-top,0px) + 64px);bottom:calc(env(safe-area-inset-bottom,0px) + 104px);
  width:58px;display:flex;flex-direction:column;align-items:center;pointer-events:auto;padding:10px 0;touch-action:none}
#track{position:relative;flex:1;width:4px;border-radius:2px;
  background:linear-gradient(to top,var(--np),var(--nc) 60%,#e2e8f0)}
#knob{position:absolute;left:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;
  background:radial-gradient(circle,#fff 0,#22d3ee 35%,rgba(34,211,238,.15) 70%);box-shadow:0 0 18px #22d3ee}
.stop{position:absolute;right:16px;transform:translateY(-50%);font:600 .58rem 'Rajdhani',sans-serif;letter-spacing:.08em;
  color:var(--td);white-space:nowrap;text-align:right;cursor:pointer}
.stop::after{content:'';position:absolute;right:-12px;top:50%;width:8px;height:1px;background:var(--border2)}
.stop.on{color:var(--txt);text-shadow:0 0 8px var(--nc)}

#bottom{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:8px}
#alt{padding:9px 14px;display:flex;align-items:baseline;gap:10px}
#alt .v{font:700 1.15rem 'Orbitron',monospace;color:var(--nc);text-shadow:0 0 14px rgba(34,211,238,.45)}
#alt .l{font-size:.72rem;color:var(--td);letter-spacing:.06em}
#alt .k{margin-left:auto;font-size:.6rem;letter-spacing:.2em;color:var(--np);text-transform:uppercase}
#acts{display:flex;gap:8px;pointer-events:auto}
#acts .btn{flex:1}
#note{font-size:.62rem;color:var(--tm);text-align:center;letter-spacing:.04em}

/* маркер «ты»: та же неоновая стрелка-ядро */
.me{width:34px;height:34px;filter:drop-shadow(0 0 8px #ff0d38)}
.me svg{width:100%;height:100%;transition:transform .3s}
.iss{display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.iss .dot{width:14px;height:14px;border-radius:50%;background:#22d3ee;box-shadow:0 0 0 4px rgba(34,211,238,.25),0 0 22px #22d3ee;
  animation:pulse 2s ease-in-out infinite}
.iss .lab{font:700 .58rem 'Orbitron',monospace;color:#22d3ee;letter-spacing:.1em;text-shadow:0 0 8px #000,0 0 12px #22d3ee;white-space:nowrap}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(34,211,238,0),0 0 30px #22d3ee}}
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="hud">
  <a class="btn glass" href="full.html">← PNEURADEN</a>
  <div class="title">Один мир · прототип</div>
  <div id="fps" class="glass">— к/с</div>
</div>

<div id="lift" class="hud glass" aria-label="Высота камеры">
  <div id="track"><div id="knob"></div></div>
</div>

<div id="bottom" class="hud">
  <div id="alt" class="glass"><span class="v" id="altv">—</span><span class="l" id="altl">высота камеры</span><span class="k" id="altk"></span></div>
  <div id="acts">
    <button class="btn glass" onclick="W.flyMe()">◎ ко мне</button>
    <button class="btn glass" onclick="W.flyISS()">🛰 к МКС</button>
    <button class="btn glass" onclick="W.orbit()">🌍 орбита</button>
  </div>
  <div id="note">Тяни лифт справа или щипок — экраны не меняются, меняется высота</div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
'use strict';
const ROVINJ={lat:45.0811,lng:13.6387};
const ALT_MIN=150, ALT_MAX=2.2e7;           // лифт: от 150 м до 22 000 км
// Остановки лифта: что «живёт» на этой высоте
const STOPS=[
  {alt:250,   name:'Улица',  k:'дома в 3D'},
  {alt:4e3,   name:'Город',  k:'ивенты'},
  {alt:9e4,   name:'Регион', k:'самолёты'},
  {alt:4.2e5, name:'МКС',    k:'орбита 420 км'},
  {alt:2e7,   name:'Земля',  k:'день и ночь'}
];

const W={
  map:null,me:{...ROVINJ,head:0},meMarker:null,issMarker:null,iss:null,_air:0,
  init(){
    const map=this.map=new maplibregl.Map({
      container:'map',center:[ROVINJ.lng,ROVINJ.lat],zoom:14.5,pitch:55,bearing:-20,maxPitch:75,
      attributionControl:{compact:true},
      pixelRatio:Math.min(2,window.devicePixelRatio||1), // 3× экраны рисуют вдвое-втрое меньше пикселей
      style:{
        version:8,
        glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
        sources:{
          base:{type:'raster',tileSize:256,maxzoom:19,
            attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
            tiles:['a','b','c','d'].map(s=>'https://'+s+'.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png')},
          night:{type:'geojson',data:this._night()},
          ev:{type:'geojson',data:this._events()},
          air:{type:'geojson',data:{type:'FeatureCollection',features:[]}},
          link:{type:'geojson',data:{type:'FeatureCollection',features:[]}}
        },
        layers:[
          {id:'bg',type:'background',paint:{'background-color':'#04050b'}},
          {id:'base',type:'raster',source:'base',paint:{'raster-contrast':.12,'raster-saturation':.25,'raster-brightness-max':.92}},
          {id:'night',type:'fill',source:'night',paint:{'fill-color':'#020314','fill-opacity':.55}},
          {id:'link',type:'line',source:'link',paint:{'line-color':'#22d3ee','line-width':1.4,'line-dasharray':[2,2],'line-opacity':.7}},
          {id:'air',type:'circle',source:'air',minzoom:5,maxzoom:12.5,
            paint:{'circle-radius':4,'circle-color':'#38bdf8','circle-blur':.3,'circle-stroke-width':1,'circle-stroke-color':'#e0f2fe'}},
          {id:'ev-glow',type:'circle',source:'ev',minzoom:10,
            paint:{'circle-radius':16,'circle-color':['get','c'],'circle-opacity':.22,'circle-blur':.9}},
          {id:'ev',type:'circle',source:'ev',minzoom:10,
            paint:{'circle-radius':5,'circle-color':['get','c'],'circle-stroke-width':1.5,'circle-stroke-color':'#fff'}}
        ]
      }
    });
    map.on('style.load',()=>{
      try{map.setProjection({type:'globe'});}catch(e){}
      this._sky();
      this._buildings();
    });
    map.on('error',e=>{ // необязательные слои (дома OpenFreeMap) не должны ронять карту
      if(e&&e.sourceId==='ofm'&&map.getLayer('b3d')){map.removeLayer('b3d');}
    });
    this._markers();this._lift();this._fps();
    map.on('move',()=>this._hud());
    map.on('moveend',()=>{clearTimeout(this._skyT);this._skyT=setTimeout(()=>this._sky(),400);});
    setInterval(()=>this._sky(),300000);
    this._hud();
    this._gps();
    this._fetchISS();setInterval(()=>this._fetchISS(),5000);
    setInterval(()=>{const s=map.getSource('night');if(s)s.setData(this._night());},60000);
    setInterval(()=>this._fetchAir(),10000);
  },
  // 3D-дома из открытых векторных тайлов OpenFreeMap (если сервер недоступен — просто без них)
  _buildings(){
    const map=this.map;
    try{
      map.addSource('ofm',{type:'vector',url:'https://tiles.openfreemap.org/planet'});
      map.addLayer({id:'b3d',type:'fill-extrusion',source:'ofm','source-layer':'building',minzoom:14,
        paint:{
          'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],8],
            0,'#1b1035',15,'#3b1d6e',40,'#7c3aed',90,'#a855f7',180,'#22d3ee'],
          'fill-extrusion-height':['coalesce',['get','render_height'],8],
          'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
          'fill-extrusion-opacity':['interpolate',['linear'],['zoom'],14,0,15,.85]
        }},'night');
    }catch(e){}
  },
  // ── высота камеры ⇄ зум (MapLibre: тайл 512 px, поле зрения ≈ 36.87°) ──
  _ctc(){const H=this.map.getCanvas().clientHeight||innerHeight;
    const fov=(this.map.transform&&this.map.transform.fov)||36.87;return .5*H/Math.tan(fov*Math.PI/360);},
  altOf(zoom,pitch,lat){const mpp=40075016.686*Math.cos(lat*Math.PI/180)/(512*Math.pow(2,zoom));
    return mpp*this._ctc()*Math.cos(pitch*Math.PI/180);},
  zoomFor(alt,pitch,lat){const d=alt/Math.max(.15,Math.cos(pitch*Math.PI/180));
    return Math.log2(40075016.686*Math.cos(lat*Math.PI/180)*this._ctc()/(512*d));},
  pitchFor(alt){ // на улице смотрим вдоль, с орбиты — прямо вниз
    const t=(Math.log(alt)-Math.log(2e3))/(Math.log(4e5)-Math.log(2e3));
    return 58*(1-Math.max(0,Math.min(1,t)));},
  sOf(alt){return (Math.log(alt)-Math.log(ALT_MIN))/(Math.log(ALT_MAX)-Math.log(ALT_MIN));},
  altOfS(s){return Math.exp(Math.log(ALT_MIN)+s*(Math.log(ALT_MAX)-Math.log(ALT_MIN)));},
  goAlt(alt,anim){
    const c=this.map.getCenter(),p=this.pitchFor(alt),z=this.zoomFor(alt,p,c.lat);
    const o={zoom:Math.max(0,Math.min(19.5,z)),pitch:p};
    anim?this.map.easeTo({...o,duration:1600,easing:t=>1-Math.pow(1-t,3)}):this.map.jumpTo(o);
  },
  curAlt(){const c=this.map.getCenter();return this.altOf(this.map.getZoom(),this.map.getPitch(),c.lat);},
  _hud(){
    const a=this.curAlt();
    document.getElementById('altv').textContent=a<1000?Math.round(a)+' м':a<1e5?(a/1000).toFixed(1)+' км':Math.round(a/1000).toLocaleString('ru-RU')+' км';
    let st=STOPS[0];for(const s of STOPS)if(a>=s.alt*.45)st=s;
    document.getElementById('altl').textContent='высота камеры · '+st.name;
    document.getElementById('altk').textContent=st.k;
    const s=Math.max(0,Math.min(1,this.sOf(a)));
    const kn=document.getElementById('knob');if(kn)kn.style.top=((1-s)*100)+'%';
    document.querySelectorAll('.stop').forEach(el=>el.classList.toggle('on',el.dataset.n===st.name));
    if(this.issMarker)this.issMarker.getElement().style.opacity=a>1.2e5?'1':'0';
  },
  _lift(){
    const tr=document.getElementById('track'),lift=document.getElementById('lift');
    STOPS.forEach(st=>{const d=document.createElement('div');d.className='stop';d.dataset.n=st.name;
      d.textContent=st.name;d.style.top=((1-this.sOf(st.alt))*100)+'%';
      d.onclick=e=>{e.stopPropagation();this.goAlt(st.alt,true);};tr.appendChild(d);});
    let drag=false;
    const at=y=>{const r=tr.getBoundingClientRect();const s=1-Math.max(0,Math.min(1,(y-r.top)/r.height));this.goAlt(this.altOfS(s),false);};
    lift.addEventListener('pointerdown',e=>{if(e.target.classList.contains('stop'))return;drag=true;lift.setPointerCapture(e.pointerId);at(e.clientY);});
    lift.addEventListener('pointermove',e=>{if(drag)at(e.clientY);});
    const up=()=>{drag=false;};lift.addEventListener('pointerup',up);lift.addEventListener('pointercancel',up);
  },
  // ── маркеры ──
  _markers(){
    const me=document.createElement('div');me.className='me';
    me.innerHTML='<svg viewBox="-1.2 -1.3 2.4 2.6"><polygon points="0,-1.25 1.09,.82 0,.35 -1.09,.82" fill="none" stroke="#22d3ee" stroke-width=".12"/><polygon points="0,-.92 .8,.6 0,.26 -.8,.6" fill="#ff0d38"/></svg>';
    this.meMarker=new maplibregl.Marker({element:me,rotationAlignment:'map',pitchAlignment:'map'}).setLngLat([this.me.lng,this.me.lat]).addTo(this.map);
    const iss=document.createElement('div');iss.className='iss';iss.innerHTML='<div class="dot"></div><div class="lab" id="issl">МКС</div>';
    this.issMarker=new maplibregl.Marker({element:iss}).setLngLat([0,0]).addTo(this.map);
  },
  _gps(){
    if(!navigator.geolocation)return;
    navigator.geolocation.watchPosition(p=>{
      this.me.lat=p.coords.latitude;this.me.lng=p.coords.longitude;
      if(p.coords.heading!=null&&!isNaN(p.coords.heading))this.me.head=p.coords.heading;
      this.meMarker.setLngLat([this.me.lng,this.me.lat]).setRotation(this.me.head);
      this._link();
    },()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
  },
  // ── МКС: та же открытая служба, что в приложении ──
  _fetchISS(){
    fetch('https://api.wheretheiss.at/v1/satellites/25544').then(r=>r.json()).then(d=>{
      this.iss={lat:d.latitude,lng:d.longitude,alt:Math.round(d.altitude),v:Math.round(d.velocity)};
      this.issMarker.setLngLat([d.longitude,d.latitude]);
      const l=document.getElementById('issl');if(l)l.textContent='МКС · '+this.iss.alt+' км · '+this.iss.v.toLocaleString('ru-RU')+' км/ч';
      this._link();
    }).catch(()=>{});
  },
  // пунктир «ты ↔ МКС», когда станция над горизонтом (≲ 2 200 км по земле)
  _link(){
    const s=this.map.getSource('link');if(!s||!this.iss)return;
    const d=this._km(this.me,this.iss);
    s.setData({type:'FeatureCollection',features:d<2200?[{type:'Feature',geometry:{type:'LineString',
      coordinates:[[this.me.lng,this.me.lat],[this.iss.lng,this.iss.lat]]},properties:{}}]:[]});
  },
  _km(a,b){const r=Math.PI/180,x=(b.lng-a.lng)*r*Math.cos((a.lat+b.lat)*r/2),y=(b.lat-a.lat)*r;return Math.hypot(x,y)*6371;},
  // ── самолёты: только когда камера на «региональной» высоте ──
  _fetchAir(){
    const a=this.curAlt();if(a<3e3||a>4e5||document.hidden)return;
    const c=this.map.getCenter(),u=['https://api.adsb.lol/v2/lat/'+c.lat.toFixed(3)+'/lon/'+c.lng.toFixed(3)+'/dist/120',
      'https://api.airplanes.live/v2/point/'+c.lat.toFixed(3)+'/'+c.lng.toFixed(3)+'/120'][this._air];
    fetch(u).then(r=>r.json()).then(d=>{
      const f=(d.ac||d.aircraft||[]).filter(q=>q.lat!=null).slice(0,200).map(q=>({type:'Feature',
        geometry:{type:'Point',coordinates:[+q.lon,+q.lat]},properties:{fl:String(q.flight||'').trim()}}));
      const s=this.map.getSource('air');if(s)s.setData({type:'FeatureCollection',features:f});
    }).catch(()=>{this._air=1-this._air;});
  },
  // ── ивенты из того же хранилища, что и главное приложение ──
  _events(){
    const C={training:'#a855f7',concert:'#ec4899',market:'#fbbf24',meetup:'#22d3ee',sport:'#34d399',other:'#818cf8'};
    let ev=[];try{ev=JSON.parse(localStorage.getItem('pnd-ev')||'[]')||[];}catch(e){}
    return{type:'FeatureCollection',features:ev.filter(e=>e.lat!=null&&e.lng!=null).map(e=>({type:'Feature',
      geometry:{type:'Point',coordinates:[+e.lng,+e.lat]},properties:{t:e.title||'',c:e.verified?(C[e.type]||'#818cf8'):'#fbbf24'}}))};
  },
  // ── Солнце: склонение и подсолнечная долгота (та же астрономия, что в приложении) ──
  _sun(){
    const d=new Date(),days=(d.getTime()-946728000000)/864e5,g=(357.529+.98560028*days)*Math.PI/180;
    const L=(280.459+.98564736*days+1.915*Math.sin(g)+.02*Math.sin(2*g))*Math.PI/180;
    const dec=Math.asin(Math.sin(.40928)*Math.sin(L));
    const st=Date.UTC(d.getUTCFullYear(),0,1),B=2*Math.PI*((d.getTime()-st)/864e5)/365.2422;
    const eot=229.18*(.000075+.001868*Math.cos(B)-.032077*Math.sin(B)-.014615*Math.cos(2*B)-.040849*Math.sin(2*B));
    const h=d.getUTCHours()+d.getUTCMinutes()/60+eot/60;return{dec,sub:((12-h)*15+540)%360-180};
  },
  _alt(lat,lng){const {dec,sub}=this._sun(),r=Math.PI/180;
    return Math.asin(Math.sin(lat*r)*Math.sin(dec)+Math.cos(lat*r)*Math.cos(dec)*Math.cos((lng-sub)*r))/r;},
  // ── небо по Солнцу над центром карты: день — фирменный неон, закат — оранжевый горизонт, ночь — глубокий синий ──
  _sky(){
    const c=this.map.getCenter(),a=this._alt(c.lat,c.lng);
    const P=a>10?{sky:'#0b1430',hor:'#3b1d6e',fog:'#0a0f1e'}:a>-4?{sky:'#1e1033',hor:'#f97316',fog:'#2a1408'}
      :a>-9?{sky:'#0b1030',hor:'#4338ca',fog:'#0a0f24'}:{sky:'#03040c',hor:'#1e1b4b',fog:'#05070f'};
    try{this.map.setSky({'sky-color':P.sky,'horizon-color':P.hor,'fog-color':P.fog,
      'sky-horizon-blend':.6,'horizon-fog-blend':.5,'fog-ground-blend':.4,
      'atmosphere-blend':['interpolate',['linear'],['zoom'],0,1,6,.8,10,0]});}catch(e){}
  },
  // ── линия ночи ──
  _night(){
    const {dec,sub}=this._sun();
    const pts=[];for(let lng=-180;lng<=180;lng+=2){const ha=(lng-sub)*Math.PI/180;
      pts.push([lng,Math.atan(-Math.cos(ha)/Math.tan(dec))*180/Math.PI]);}
    const pole=dec>=0?-89.9:89.9;
    return{type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[[[-180,pole],...pts,[180,pole],[-180,pole]]]}};
  },
  // ── кинематографичные переходы: как смена героя в GTA 5 — вверх, вбок, вниз ──
  flyMe(){this.map.flyTo({center:[this.me.lng,this.me.lat],zoom:this.zoomFor(250,this.pitchFor(250),this.me.lat),
    pitch:this.pitchFor(250),bearing:this.me.head||-20,duration:4200,curve:1.8,essential:true});},
  flyISS(){if(!this.iss)return;this.map.flyTo({center:[this.iss.lng,this.iss.lat],zoom:2.4,pitch:0,bearing:0,duration:4200,curve:1.6,essential:true});},
  orbit(){this.map.flyTo({center:[this.me.lng,this.me.lat],zoom:1.3,pitch:0,bearing:0,duration:3600,curve:1.4,essential:true});},
  // ── счётчик кадров: главная мера пробы на телефоне ──
  _fps(){
    const el=document.getElementById('fps');let n=0,t0=performance.now();
    const f=now=>{n++;if(now-t0>=1000){const v=Math.round(n*1000/(now-t0));el.textContent=v+' к/с';
      el.className='glass'+(v<30?' bad':v<50?' low':'');n=0;t0=now;}requestAnimationFrame(f);};
    requestAnimationFrame(f);
  }
};
if(window.maplibregl)W.init();
else document.getElementById('note').textContent='Не загрузилась библиотека карты — проверь интернет';
</script>
